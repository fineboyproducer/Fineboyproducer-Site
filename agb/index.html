<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artist Growth Bundle — Fineboy Producer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070707;
  --bg-elevated: #0f0f0f;
  --bg-panel: #121212;
  --bg-soft: #161616;
  --text: #f4f1ea;
  --text-muted: #9a958c;
  --text-dim: #6b665e;
  --accent: #c9a24b;
  --accent-soft: rgba(201, 162, 75, 0.14);
  --accent-glow: rgba(201, 162, 75, 0.22);
  --line: rgba(244, 241, 234, 0.08);
  --line-strong: rgba(244, 241, 234, 0.16);
  --radius: 2px;
  --font-display: 'Bebas Neue', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Instrument Sans', system-ui, sans-serif;
  --space-xs: 8px;
  --space-sm: 16px;
  --space-md: 24px;
  --space-lg: 40px;
  --space-xl: 64px;
  --space-2xl: 96px;
  --space-3xl: 140px;
  --max: 1180px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 80px;
  -webkit-text-size-adjust: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* subtle film grain */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; border: none; background: none; cursor: pointer; color: inherit; }
ul { list-style: none; }

.wrap {
  width: min(var(--max), 100% - 40px);
  margin: 0 auto;
}

/* ——— TYPOGRAPHY ——— */
.eyebrow {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: var(--space-sm);
}

h1, h2, h3, .display {
  font-family: var(--font-display);
  font-weight: 400;
  line-height: 0.95;
  letter-spacing: 0.02em;
}

h1 {
  font-size: clamp(48px, 9.5vw, 96px);
}

h2 {
  font-size: clamp(36px, 6vw, 60px);
}

h3 {
  font-size: clamp(24px, 3vw, 30px);
}

.lead {
  font-size: clamp(18px, 2.2vw, 21px);
  color: var(--text-muted);
  max-width: 540px;
  line-height: 1.55;
}

/* ——— BUTTONS ——— */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 16px 28px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  transition: transform 0.25s var(--ease), background 0.25s, border-color 0.25s, color 0.25s;
  white-space: nowrap;
}

.btn-primary {
  background: var(--accent);
  color: #0a0a0a;
  border-color: var(--accent);
}

.btn-primary:hover {
  background: #d4af5a;
  transform: translateY(-2px);
}

.btn-ghost {
  background: transparent;
  color: var(--text);
  border-color: var(--line-strong);
}

.btn-ghost:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-2px);
}

.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

/* ——— NAV ——— */
.nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 18px 0;
  background: rgba(7, 7, 7, 0.72);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.3s, background 0.3s;
}

.nav.scrolled {
  border-bottom-color: var(--line);
  background: rgba(7, 7, 7, 0.9);
}

.nav .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.logo span { color: var(--accent); }

.nav-links {
  display: flex;
  align-items: center;
  gap: 28px;
}

.nav-links a {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  transition: color 0.2s;
}

.nav-links a:hover { color: var(--text); }

.nav-cta {
  font-size: 12px !important;
  padding: 10px 18px !important;
}

.nav-toggle {
  display: none;
  width: 28px;
  height: 20px;
  position: relative;
  z-index: 110;
}

.nav-toggle span {
  display: block;
  width: 100%;
  height: 1.5px;
  background: var(--text);
  position: absolute;
  left: 0;
  transition: transform 0.3s, opacity 0.3s;
}

.nav-toggle span:nth-child(1) { top: 0; }
.nav-toggle span:nth-child(2) { top: 9px; }
.nav-toggle span:nth-child(3) { top: 18px; }

/* ——— HERO ——— */
.hero {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 140px 0 100px;
  overflow: hidden;
}

.hero::before {
  content: "";
  position: absolute;
  top: -20%;
  left: 50%;
  transform: translateX(-50%);
  width: 120%;
  height: 80%;
  background: radial-gradient(ellipse 50% 50% at 50% 40%, var(--accent-glow), transparent 70%);
  pointer-events: none;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 60px;
  align-items: center;
}

.hero-copy {
  position: relative;
  z-index: 2;
}

.hero h1 {
  margin: 0 0 var(--space-md);
}

.hero h1 em {
  font-style: normal;
  color: var(--accent);
}

.hero .lead {
  margin-bottom: var(--space-lg);
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: var(--space-xl);
}

.hero-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 24px;
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
}

.hero-meta span {
  display: flex;
  align-items: center;
  gap: 8px;
}

.hero-meta span::before {
  content: "";
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  opacity: 0.7;
}

/* Bundle visual composition */
.hero-visual {
  position: relative;
  height: 480px;
  z-index: 1;
}

.artifact {
  position: absolute;
  background: var(--bg-panel);
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  overflow: hidden;
  transition: transform 0.5s var(--ease);
}

.artifact-1 {
  width: 220px;
  height: 300px;
  top: 20px;
  left: 10%;
  transform: rotate(-8deg);
  z-index: 3;
}

.artifact-2 {
  width: 200px;
  height: 280px;
  top: 60px;
  right: 8%;
  transform: rotate(6deg);
  z-index: 2;
}

.artifact-3 {
  width: 180px;
  height: 240px;
  bottom: 30px;
  left: 28%;
  transform: rotate(-3deg);
  z-index: 4;
}

.artifact-4 {
  width: 160px;
  height: 120px;
  bottom: 80px;
  right: 18%;
  transform: rotate(4deg);
  z-index: 1;
  background: linear-gradient(145deg, #1a1814, #12100e);
}

.artifact-cover {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 22px 18px;
  background: linear-gradient(160deg, #1c1914 0%, #0e0d0b 100%);
  position: relative;
}

.artifact-cover::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.4));
  pointer-events: none;
}

.artifact-num {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.15em;
  color: var(--accent);
}

.artifact-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 400;
  line-height: 1.1;
  position: relative;
  z-index: 1;
}

.artifact-title small {
  display: block;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-top: 6px;
}

.artifact-bar {
  height: 3px;
  width: 40px;
  background: var(--accent);
  margin-top: 12px;
}

.hero-visual:hover .artifact-1 { transform: rotate(-10deg) translateY(-6px); }
.hero-visual:hover .artifact-2 { transform: rotate(8deg) translateY(-4px); }
.hero-visual:hover .artifact-3 { transform: rotate(-5deg) translateY(-8px); }

/* ——— TRUST STRIP ——— */
.trust {
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 28px 0;
  background: var(--bg-elevated);
}

.trust-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--text-dim);
  text-align: center;
  margin-bottom: 20px;
}

.trust-items {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px 40px;
}

.trust-items span {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-muted);
}

/* ——— SECTIONS COMMON ——— */
section {
  padding: var(--space-3xl) 0;
  position: relative;
}

.section-head {
  max-width: 640px;
  margin-bottom: var(--space-xl);
}

.section-head h2 {
  margin-bottom: var(--space-sm);
}

.section-head .lead {
  margin-top: var(--space-sm);
}

/* ——— PROBLEM ——— */
.problem {
  background: var(--bg);
}

.problem-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: start;
}

.problem-list {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.problem-item {
  display: grid;
  grid-template-columns: 48px 1fr;
  gap: 20px;
  padding: 28px 0;
  border-bottom: 1px solid var(--line);
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
}

.problem-item.visible {
  opacity: 1;
  transform: none;
}

.problem-item:first-child { border-top: 1px solid var(--line); }

.problem-num {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 400;
  color: var(--accent);
  letter-spacing: 0.1em;
  padding-top: 4px;
}

.problem-item h3 {
  font-size: 20px;
  margin-bottom: 6px;
}

.problem-item p {
  font-size: 15px;
  color: var(--text-muted);
  line-height: 1.5;
}

/* ——— TRANSFORMATION ——— */
.transform {
  background: var(--bg-elevated);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.transform-grid {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 40px;
  align-items: stretch;
}

.transform-col {
  padding: 36px 32px;
  background: var(--bg-panel);
  border: 1px solid var(--line);
}

.transform-col.before {
  border-color: var(--line);
}

.transform-col.after {
  border-color: rgba(201, 162, 75, 0.35);
  background: linear-gradient(160deg, #14120e 0%, #0f0e0c 100%);
}

.transform-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  margin-bottom: 28px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.transform-label::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.transform-col.before .transform-label { color: var(--text-dim); }
.transform-col.before .transform-label::before { background: var(--text-dim); }

.transform-col.after .transform-label { color: var(--accent); }
.transform-col.after .transform-label::before { background: var(--accent); }

.transform-list li {
  font-size: 17px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  color: var(--text-muted);
}

.transform-col.after .transform-list li {
  color: var(--text);
}

.transform-list li:last-child { border-bottom: none; }

.transform-arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  font-size: 28px;
  opacity: 0.7;
}

/* ——— WHAT'S INSIDE ——— */
.inside {
  background: var(--bg);
}

.deliverables {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.deliverable {
  position: relative;
  background: var(--bg-panel);
  border: 1px solid var(--line);
  padding: 36px 32px;
  display: flex;
  flex-direction: column;
  min-height: 280px;
  transition: border-color 0.3s, transform 0.3s var(--ease);
  overflow: hidden;
}

.deliverable:hover {
  border-color: rgba(201, 162, 75, 0.4);
  transform: translateY(-3px);
}

.deliverable:nth-child(1) { grid-column: 1 / 2; }
.deliverable:nth-child(2) { grid-column: 2 / 3; }
.deliverable:nth-child(3) { grid-column: 1 / 2; }
.deliverable:nth-child(4) { grid-column: 2 / 3; }

.deliverable-num {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 20px;
}

.deliverable h3 {
  margin-bottom: 12px;
  font-size: 24px;
}

.deliverable p {
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.55;
  flex: 1;
  margin-bottom: 24px;
}

.deliverable .btn {
  align-self: flex-start;
  font-size: 12px;
  padding: 12px 20px;
}

.deliverable-visual {
  position: absolute;
  bottom: -20px;
  right: -10px;
  width: 120px;
  height: 160px;
  background: linear-gradient(160deg, #1c1914, #0e0d0b);
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  transform: rotate(8deg);
  opacity: 0.35;
  pointer-events: none;
}

/* ——— BUNDLE SHOWCASE ——— */
.showcase {
  background: var(--bg-elevated);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  text-align: center;
  overflow: hidden;
}

.showcase .section-head {
  margin-left: auto;
  margin-right: auto;
  text-align: center;
}

.showcase-stage {
  position: relative;
  height: 420px;
  margin-top: var(--space-xl);
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}

.stage-item {
  position: absolute;
  background: var(--bg-panel);
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.55);
  overflow: hidden;
}

.stage-item .cover {
  height: 100%;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: linear-gradient(155deg, #1a1712 0%, #0c0b09 100%);
}

.stage-1 {
  width: 200px;
  height: 280px;
  left: 5%;
  top: 40px;
  transform: rotate(-12deg);
  z-index: 2;
}

.stage-2 {
  width: 220px;
  height: 300px;
  left: 50%;
  top: 10px;
  transform: translateX(-50%) rotate(2deg);
  z-index: 4;
}

.stage-3 {
  width: 190px;
  height: 260px;
  right: 6%;
  top: 60px;
  transform: rotate(10deg);
  z-index: 3;
}

.stage-4 {
  width: 140px;
  height: 100px;
  left: 22%;
  bottom: 20px;
  transform: rotate(-4deg);
  z-index: 1;
  background: linear-gradient(145deg, #1f1c16, #12100e);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.12em;
  color: var(--accent);
  border: 1px solid rgba(201, 162, 75, 0.25);
}

/* ——— VALUE / PRICING ——— */
.value {
  background: var(--bg);
}

.value-panel {
  max-width: 720px;
  margin: 0 auto;
  border: 1px solid var(--line-strong);
  background: var(--bg-panel);
  padding: clamp(40px, 6vw, 64px);
  text-align: center;
  position: relative;
}

.value-panel::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

.value-stack {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px 18px;
  margin: 32px 0 28px;
}

.value-stack span {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 8px 14px;
  border: 1px solid var(--line);
  background: var(--bg-soft);
}

.value-equals {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.2em;
  color: var(--accent);
  margin: 8px 0 28px;
}

.value-name {
  font-family: var(--font-display);
  font-size: clamp(32px, 4.5vw, 44px);
  font-weight: 400;
  margin-bottom: 8px;
}

.value-desc {
  color: var(--text-muted);
  font-size: 16px;
  max-width: 440px;
  margin: 0 auto 36px;
}

.value-cta {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.value-note {
  font-size: 13px;
  color: var(--text-dim);
  font-style: italic;
}

/* ——— WHO IT'S FOR ——— */
.for {
  background: var(--bg-elevated);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.for-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.for-card {
  padding: 32px 28px;
  background: var(--bg-panel);
  border: 1px solid var(--line);
  transition: border-color 0.3s;
}

.for-card:hover {
  border-color: rgba(201, 162, 75, 0.3);
}

.for-card h3 {
  font-size: 18px;
  margin-bottom: 10px;
}

.for-card p {
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.5;
}

/* ——— FAQ ——— */
.faq {
  background: var(--bg);
}

.faq-list {
  max-width: 720px;
  margin: 0 auto;
}

.faq-item {
  border-bottom: 1px solid var(--line);
}

.faq-item:first-child {
  border-top: 1px solid var(--line);
}

.faq-q {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 22px 0;
  text-align: left;
  font-size: 17px;
  font-weight: 500;
  transition: color 0.2s;
}

.faq-q:hover { color: var(--accent); }

.faq-icon {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  position: relative;
}

.faq-icon::before,
.faq-icon::after {
  content: "";
  position: absolute;
  background: var(--text-muted);
  transition: transform 0.3s var(--ease), background 0.2s;
}

.faq-icon::before {
  width: 12px;
  height: 1.5px;
  top: 11px;
  left: 6px;
}

.faq-icon::after {
  width: 1.5px;
  height: 12px;
  top: 6px;
  left: 11px;
}

.faq-item.open .faq-icon::after {
  transform: scaleY(0);
}

.faq-item.open .faq-q { color: var(--accent); }
.faq-item.open .faq-icon::before,
.faq-item.open .faq-icon::after { background: var(--accent); }

.faq-a {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s var(--ease);
}

.faq-a-inner {
  padding: 0 0 24px;
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.6;
  max-width: 580px;
}

/* ——— FINAL CTA ——— */
.final {
  background: var(--bg);
  text-align: center;
  padding: var(--space-3xl) 0;
  position: relative;
  overflow: hidden;
}

.final::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse 60% 50% at 50% 30%, var(--accent-glow), transparent 70%);
  pointer-events: none;
}

.final .wrap {
  position: relative;
  z-index: 1;
}

.final h2 {
  max-width: 700px;
  margin: 0 auto var(--space-md);
}

.final .lead {
  margin: 0 auto var(--space-lg);
  max-width: 480px;
}

/* ——— FOOTER ——— */
footer {
  border-top: 1px solid var(--line);
  padding: 48px 0 40px;
  background: var(--bg-elevated);
}

.footer-top {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 40px;
  margin-bottom: 40px;
}

.footer-brand .logo {
  margin-bottom: 10px;
}

.footer-brand p {
  font-size: 14px;
  color: var(--text-dim);
  font-style: italic;
}

.footer-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 40px;
}

.footer-col h4 {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 16px;
}

.footer-col a {
  display: block;
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 10px;
  transition: color 0.2s;
}

.footer-col a:hover { color: var(--text); }

.footer-bottom {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 16px;
  padding-top: 28px;
  border-top: 1px solid var(--line);
  font-size: 13px;
  color: var(--text-dim);
}
